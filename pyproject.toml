
[build-system]
requires = ["setuptools >= 75.3.4", "setuptools-scm>=9.2.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hong2p"]

# TODO separately need a `include-package-data = true` line in above tool.setuptools
# section?
# https://stackoverflow.com/questions/69647590/specifying-package-data-in-pyproject-toml
[tool.setuptools.package-data]
# really just want to include hong2p/hong2p/mol2chemfig.sty for now
hong2p = ["mol2chemfig.sty"]

[project]
name = "hong2p"
# TODO worth using `dynamic = ["version"]` instead? work w/ git (w/o explicit tags)?
# required, and not sure if i can set up dynamically from git
# make this exactly 3.8 (i've been using 3.8.12)?
# (want to expand support to newer versions tho)
requires-python = ">= 3.8"
# Core dependencies, enough to import hong2p.{err,types,pandas,olf,thor,util,matlab,chem,
# cli_entry_points} (see test/test_core_imports.py, and the tox `core` env below). Other
# modules (viz, roi, suite2p, xarray, latex), the CLIs using them, and some functions in
# the core modules (which import what they need inside the function) require the `all`
# extra below.
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    "platformdirs",
    "PyYAML",
    "tifffile",
    "tqdm",
]
# TODO TODO see what happens with this
# (it probably isn't doing anything by itself. prob need to also refer to it in separte
# setuptools dynamic section...)
dynamic = ["version"]
#version = "0.0.0"
#
authors = [
  {name = "Tom O'Connell", email = "tom.oconn3ll@gmail.com"},
]
# TODO update to this newer way at some point
#license = "GPLv3"
#license-files = [
#    "LICENSE",
#]
# seems i need this older way to specify license w/ my current setuptools 56/61
license = {file = "LICENSE"}
keywords = ["imaging", "neuroscience", "olfaction", "drosophila"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
description = "Functions for working with data from Hong olfaction imaging data"
readme = "README.md"

[project.optional-dependencies]
# Everything else. Install with `pip install 'hong2p[all]'` (or
# `pip install 'hong2p[all] @ git+https://github.com/ejhonglab/hong2p'`)
all = [
    # importlib.resources.files (used in hong2p.xarray) was added in python 3.9.
    # backport only needed for python 3.8.
    "importlib_resources; python_version < '3.9'",

    # technically just need >=1.8 for scipy.sparse.coo_array, but installed 1.10.1
    # in al_analysis, and may need some features added after 1.8 in there
    "scipy>=1.8",

    "xarray",
    # so I can always use this backend for writing xarray files, rather than potentially
    # falling back to scipy, which only supports version 3
    # TODO or is there reason to want to use h5netcdf?
    "netCDF4",

    "PyQt5",
    "pyqtgraph",

    "matplotlib",
    "seaborn",
    # https://github.com/ppinard/matplotlib-scalebar
    "matplotlib-scalebar",
    "colorcet",

    "scikit-learn",
    "gitpython",

    "jinja2",
    # How does what PyLaTeX offers compare? As of 2023, PyLaTeX last updated 2021,
    # while [mbr/]latex was last updated 2019.
    "latex",

    # only used by savedeps CLI
    "requests",

    # was using 1.6.0
    # just for rendering CID -> chemfig latex structures in hong2p.chem.
    # also manually copied mol2chemfig.sty to this repo from (I believe) the CTAN
    # package mol2chemfig, which is required so we can also render those .tex
    # outputs into standalone PDFs
    "mol2chemfigPy3",

    # https://stackoverflow.com/questions/32688688
    # TODO any way to get this to not conflict w/ al_analysis, if it's also
    # specified in a requirements.txt generated in al_analysis venv? version appears the
    # same, but it still conflicts...
    # ```
    # ERROR: Cannot install -r git-requirements.txt (line 8) and hong2p 0.0.0 (from
    # git+https://github.com/ejhonglab/hong2p@a7968919d3bf...#egg=hong2p)
    # because these package versions have conflicting dependencies.
    #
    # The conflict is caused by:
    # The user requested hong2p 0.0.0 (from
    # git+https://github.com/ejhonglab/hong2p@a7968919d3bf...#egg=hong2p)
    # natmix 0.0.0 depends on hong2p 0.0.0 (from
    # git+https://github.com/ejhonglab/hong2p)
    # ```
    "ijroi @ git+https://github.com/tom-f-oconnell/ijroi",
]
dev = [
    # tests cover modules requiring the optional deps too
    "hong2p[all]",
    # pytest addopts below use IPython debugger (installed w/ ipdb), and some tests /
    # scripts call ipdb.set_trace()
    "ipdb",
    # TODO some way to not need to repeat this (across here and minversion below)?
    "pytest >= 8.3.5",
    # for running tests across multiple python/dependency versions (`tox`)
    "tox >= 4.21; python_version >= '3.9'",
    "tox-uv; python_version >= '3.9'",
]
# for building documentation (under docsrc/) via `hong2p-docs` (see README).
# latest versions as of 2026-10 (sphinx 9.1 requires python >= 3.12).
doc = [
    # autodoc imports all modules
    "hong2p[all]",
    "sphinx==9.1.0",
    "sphinx-rtd-theme==3.1.0",
    "sphinxcontrib-apidoc==0.6.0",
    "sphinx-prompt==1.10.2",
    "sphinx-autodoc-typehints==3.15.0",
]

[project.urls]
Repository = "https://github.com/ejhonglab/hong2p"

[project.scripts]
savedeps = "hong2p.cli_entry_points:save_requirements"
thor2tiff = "hong2p.cli_entry_points:thor2tiff_cli"
showsync = "hong2p.cli_entry_points:showsync_cli"
suite2p-params = "hong2p.cli_entry_points:suite2p_params_cli"
thor-pairs = "hong2p.cli_entry_points:print_paired_thor_subdirs"
thor-notes = "hong2p.cli_entry_points:print_thorimage_subdir_notes"
# Mainly to support shell functions that cd to these directories, e.g
# 2p() {
#     cd "$(hong2p-data)"
# }
hong2p-data = "hong2p.cli_entry_points:print_data_root"
hong2p-raw = "hong2p.cli_entry_points:print_raw_data_root"
hong2p-analysis = "hong2p.cli_entry_points:print_analysis_intermediates_root"
yaml2tex = "hong2p.cli_entry_points:yaml2tex_cli"
cid2tex = "hong2p.cli_entry_points:cid2tex_cli"
# rebuilds docs/ from docsrc/ and commits docs/. run from hong2p repo root.
hong2p-docs = "hong2p.cli_entry_points:build_docs_cli"

[tool.pytest.ini_options]
minversion = "8.3.5"
# NOTE: seems we must use :TerminalPdb instead of :Pdb, in order for tab complete to
# work
# -s is short for --capture=no
addopts = "--doctest-modules --doctest-continue-on-failure --doctest-report udiff --pdbcls=IPython.terminal.debugger:TerminalPdb --ignore=test/test_template_matching.py --no-header -q --tb=short -s -vv"
testpaths = [
    "test",
    "hong2p",
]
# TODO other options that would make them easier to write?
# TODO something like NORMALIZE_WHITESPACE, but so stuff like [1,2,3] and [1, 2, 3] are
# considered equal?
doctest_optionflags = "NORMALIZE_WHITESPACE"

# pytest's builtin tmp_path fixture will create temp dirs under /tmp/pytest-of-<user>,
# and default retention policy ("all") does not clear their contents. The "none"
# retention policy will remove all of these temp dirs after test completion, regardless
# of test failure/success.
# NOTE: override by adding `-o tmp_path_retention_policy=all` to pytest CLI args.
tmp_path_retention_policy = "none"
# TODO try adding pytest-checkipdb? (seems like it's basically a linter to remind you of
# straggling breakpoints? just use a linter for that instead?)

# TODO possible to add a marker to select only doctest tests? is there already some
# mechanism i could use to select them? `pytest --markers` didn't reveal any...
markers = "slow: deselect with (`-m 'not slow'`)"

filterwarnings = [
    # xarray==0.19 with modern setuptools (probably anything more recent than about
    # 60-64) will cause these warnings when pytest is collecting tests
    'ignore:distutils Version classes are deprecated. Use packaging.version instead.:DeprecationWarning',
    'ignore:pkg_resources is deprecated as an API.:DeprecationWarning',
    'ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning',
]

# Plain `pytest` just runs in the current environment. `tox` runs the tests in all of
# the envs below (`tox -e py38` / `tox -e current` for just one). Extra args after `--`
# are passed to pytest, e.g. `tox -- -k sort_odors`.
# Requires `pip install -e .[dev]` (for tox + tox-uv). tox-uv will download python 3.8
# if needed.
[tool.tox]
requires = ["tox >= 4.21", "tox-uv"]
env_list = ["py38", "current"]
# tox otherwise strips most env vars. these are used to find data (see util.data_root)
env_run_base = { pass_env = ["HONG2P_DATA", "HONG_NAS"] }

# Oldest supported versions: python 3.8 + pins from exact-requirements.txt (except
# pandas 1.5, see requirements-py38-test.txt)
[tool.tox.env.py38]
base_python = ["python3.8"]
deps = ["-r requirements-py38-test.txt"]
# for the optional deps not pinned above (e.g. importlib_resources, mol2chemfigPy3)
extras = ["all"]
commands = [["pytest", { replace = "posargs", extend = true }]]

# Only the core dependencies (no extras), to check they are sufficient for the core
# modules (see test/test_core_imports.py), their tests, and their doctests.
# Run separately (`tox -e core`); not in env_list above.
[tool.tox.env.core]
deps = ["pytest >= 8.3.5"]
commands = [["pytest", { replace = "posargs", extend = true, default = [
    "test/test_core_imports.py",
    "test/test_thor_xml.py",
    "test/test_olf.py",
    "test/test_pandas.py",
    "test/test_util.py",
    "hong2p/__init__.py",
    "hong2p/err.py",
    "hong2p/types.py",
    "hong2p/pandas.py",
    "hong2p/olf.py",
    "hong2p/thor.py",
    "hong2p/util.py",
    "hong2p/matlab.py",
    "hong2p/chem.py",
    "hong2p/cli_entry_points.py",
] }]]

# The existing ./venv, as-is (tox does not install anything into it)
[tool.tox.env.current]
skip_install = true
allowlist_externals = ["{tox_root}/venv/bin/python"]
commands = [
    ["{tox_root}/venv/bin/python", "-m", "pytest", { replace = "posargs", extend = true }],
]
